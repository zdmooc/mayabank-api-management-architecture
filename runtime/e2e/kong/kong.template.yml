_format_version: "3.0"
_transform: true

# One Kong consumer per registered OAuth2 client application.
# The jwt plugin resolves the consumer from the `azp` claim (Keycloak client
# id) and verifies the RS256 signature with the realm public key. A token from
# a client that has not been onboarded at the gateway is rejected with 401.
# Rendered by scripts/render-kong-config.sh from KONG_CLIENT_IDS.
consumers:
__KONG_CONSUMERS__

services:
  - name: payment-api
    url: http://payment-api:8080
    routes:
      - name: payment-api-route
        paths:
          - /payments
        strip_path: false
      - name: payment-health-route
        paths:
          - /health
        strip_path: false

    plugins:
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true

      # Counters are kept per consumer: one partner exhausting its budget does
      # not throttle the others. `local` policy = per gateway node (lab only).
      - name: rate-limiting
        config:
          minute: __RATE_LIMIT_PER_MINUTE__
          limit_by: consumer
          policy: local

      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

      - name: jwt
        config:
          key_claim_name: azp
          claims_to_verify:
            - exp
