apiVersion: v1
kind: Namespace
metadata:
  name: mayabank-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: mayabank-api
spec:
  replicas: 1
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata: {labels: {app: keycloak}}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.0
          args: ["start-dev", "--http-enabled=true"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: e2e-admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-admin, key: password}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            tcpSocket: {port: 8080}
            failureThreshold: 90
            periodSeconds: 3
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: keycloak, namespace: mayabank-api}
spec:
  selector: {app: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payment-api, namespace: mayabank-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment-api}}
  template:
    metadata: {labels: {app: payment-api}}
    spec:
      containers:
        - name: payment-api
          image: mayabank-payment-api:kind
          imagePullPolicy: Never
          env:
            - {name: OIDC_EXPECTED_ISSUER, value: "http://localhost:8080/realms/mayabank"}
            - {name: OIDC_JWKS_URL, value: "http://keycloak:8080/realms/mayabank/protocol/openid-connect/certs"}
            - {name: OIDC_AUDIENCE, value: payment-api}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata: {name: payment-api, namespace: mayabank-api}
spec:
  selector: {app: payment-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
