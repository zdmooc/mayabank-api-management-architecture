_format_version: "3.0"
_transform: true

consumers:
  - username: payment-client
    jwt_secrets:
      - key: "payment-client"
        algorithm: RS256
        secret: "unused-for-rs256"
        rsa_public_key: |-
__KEYCLOAK_PUBLIC_KEY_INDENTED__

  - username: partner-b-client
    jwt_secrets:
      - key: "partner-b-client"
        algorithm: RS256
        secret: "unused-for-rs256"
        rsa_public_key: |-
__KEYCLOAK_PUBLIC_KEY_INDENTED__
  - username: read-only-client
    jwt_secrets:
      - key: "read-only-client"
        algorithm: RS256
        secret: "unused-for-rs256"
        rsa_public_key: |-
__KEYCLOAK_PUBLIC_KEY_INDENTED__
  - username: wrong-audience-client
    jwt_secrets:
      - key: "wrong-audience-client"
        algorithm: RS256
        secret: "unused-for-rs256"
        rsa_public_key: |-
__KEYCLOAK_PUBLIC_KEY_INDENTED__

services:
  - name: payment-api
    url: http://payment-api:8080
    routes:
      - name: payment-api-route
        paths:
          - /payments
        strip_path: false
      - name: payment-health-route
        paths:
          - /health
        strip_path: false

    plugins:
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true

      - name: rate-limiting
        config:
          minute: __RATE_LIMIT_PER_MINUTE__
          policy: local
          limit_by: consumer

      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

      - name: jwt
        config:
          key_claim_name: azp
          claims_to_verify:
            - exp
