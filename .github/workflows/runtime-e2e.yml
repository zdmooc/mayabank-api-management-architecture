name: api-management-runtime-e2e

on:
  push:
    branches: [main]
    paths:
      - "runtime/e2e/**"
      - "apis/openapi/**"
      - ".github/workflows/runtime-e2e.yml"
  pull_request:
    paths:
      - "runtime/e2e/**"
      - "apis/openapi/**"
      - ".github/workflows/runtime-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Generate runtime-only credentials
        run: |
          KC_VALUE="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          CLIENT_VALUE="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          READ_VALUE="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          WRONG_AUD_VALUE="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          UNREGISTERED_VALUE="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          PARTNER_VALUE="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$KC_VALUE"
          echo "::add-mask::$CLIENT_VALUE"
          echo "::add-mask::$READ_VALUE"
          echo "::add-mask::$WRONG_AUD_VALUE"
          echo "::add-mask::$UNREGISTERED_VALUE"
          echo "::add-mask::$PARTNER_VALUE"
          echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$KC_VALUE" >> "$GITHUB_ENV"
          echo "PAYMENT_CLIENT_SECRET=$CLIENT_VALUE" >> "$GITHUB_ENV"
          echo "READ_ONLY_CLIENT_SECRET=$READ_VALUE" >> "$GITHUB_ENV"
          echo "WRONG_AUDIENCE_CLIENT_SECRET=$WRONG_AUD_VALUE" >> "$GITHUB_ENV"
          echo "UNREGISTERED_CLIENT_SECRET=$UNREGISTERED_VALUE" >> "$GITHUB_ENV"
          echo "PARTNER_CLIENT_SECRET=$PARTNER_VALUE" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_PER_MINUTE=20" >> "$GITHUB_ENV"
          unset KC_VALUE CLIENT_VALUE READ_VALUE WRONG_AUD_VALUE UNREGISTERED_VALUE PARTNER_VALUE

      - name: Payment API unit and contract tests
        run: |
          python3 -m pip install -q -r runtime/e2e/payment-api/requirements-test.txt
          python3 -m pytest -q runtime/e2e/payment-api/tests

      - name: Start Keycloak and Payment API
        run: docker compose -f runtime/e2e/docker-compose.yml up -d --build keycloak payment-api

      - name: Bootstrap Keycloak
        run: bash runtime/e2e/scripts/bootstrap-keycloak.sh

      - name: Render Kong declarative config
        run: bash runtime/e2e/scripts/render-kong-config.sh

      - name: Start Kong
        run: docker compose -f runtime/e2e/docker-compose.yml up -d kong

      - name: Execute E2E proof
        run: bash runtime/e2e/scripts/test-e2e.sh

      - name: Diagnostics
        if: failure()
        run: docker compose -f runtime/e2e/docker-compose.yml logs --no-color --tail=250

      - name: Cleanup
        if: always()
        run: docker compose -f runtime/e2e/docker-compose.yml down -v --remove-orphans
