name: validate-contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Install Payment API unit-test dependencies
        run: pip install -r runtime/e2e/payment-api/requirements.txt

      - name: Payment API security and regression tests
        run: python -m unittest discover -s runtime/e2e/tests -p 'test_*.py' -v

      - name: Validate API specification with Spectral
        run: npx --yes @stoplight/spectral-cli@6 lint apis/openapi/payment-api.yaml --fail-severity error

      - name: Validate AsyncAPI specification
        run: npx --yes @asyncapi/cli@latest validate apis/asyncapi/payment-events.yaml

      - name: Validate OpenAPI
        run: python scripts/validate_openapi.py apis/openapi/payment-api.yaml

      - name: Validate AsyncAPI
        run: python scripts/validate_asyncapi.py apis/asyncapi/payment-events.yaml

      - name: Secret hygiene
        run: python scripts/no_secrets_check.py

      - name: Shared-platform CRC profile gate
        shell: bash
        run: |
          set -euo pipefail
          bash -n runtime/shared-platform/scripts/*.sh
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = [
              Path("runtime/shared-platform/capability-consumption.yaml"),
              *sorted(Path("runtime/shared-platform/manifests").glob("*.yaml")),
          ]
          for path in paths:
              docs=list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              assert docs and all(doc is not None for doc in docs), path
              print("validated", path)
          PY
          test -s runtime/shared-platform/kong/kong.template.yml
          grep -q 'traces_endpoint: "__OTEL_TRACES_ENDPOINT__"' runtime/shared-platform/kong/kong.template.yml
          grep -q 'keycloak-service.keycloak-system.svc:8080' runtime/shared-platform/manifests/payment-api.yaml
          grep -q 'otel-collector.shared-observability.svc:4318' runtime/shared-platform/capability-consumption.yaml
          grep -q '__D090_AI_ACCESS_SERVICE__' runtime/shared-platform/kong/kong.template.yml
          grep -q 'D090_AI_ACCESS_ENABLED' runtime/shared-platform/scripts/render-kong-config.sh
          grep -q 'KEYCLOAK_ISSUER_OVERRIDE' runtime/shared-platform/scripts/render-kong-config.sh
          grep -q 'ai-access-policy.tradeops.svc:8020' runtime/shared-platform/scripts/render-kong-config.sh
          grep -q 'D090_KONG_AI_ROUTE=PASS' runtime/shared-platform/scripts/enable-d090-ai-access-crc.sh
          grep -q 'KONG_CONFIG_OUTPUT_FILE' runtime/shared-platform/scripts/render-kong-config.sh
          grep -q 'D090_KONG_RECOVERY=PASS' runtime/shared-platform/scripts/enable-d090-ai-access-crc.sh
          grep -q 'D090_KONG_CONFIG_PERSIST=PASS' runtime/shared-platform/scripts/enable-d090-ai-access-crc.sh
          ! grep -q 'hide_credentials' runtime/shared-platform/scripts/render-kong-config.sh
          bash -n runtime/shared-platform/scripts/render-kong-config.sh
          bash -n runtime/shared-platform/scripts/enable-d090-ai-access-crc.sh

      - name: Kong admin network exposure static regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          items = list(yaml.safe_load_all(
              Path("runtime/shared-platform/manifests/kong.yaml").read_text()
          ))
          deployment, service, route = items
          env = {e["name"]: e["value"] for e in deployment["spec"]["template"]["spec"]["containers"][0]["env"]}
          assert env["KONG_ADMIN_LISTEN"] == "127.0.0.1:8001"
          assert env["KONG_STATUS_LISTEN"] == "0.0.0.0:8100"
          assert "admin" not in [p["name"] for p in service["spec"]["ports"]]
          assert "admin" not in [p["name"] for p in deployment["spec"]["template"]["spec"]["containers"][0]["ports"]]
          assert route["spec"]["port"]["targetPort"] == "proxy"
          print("KONG_ADMIN_NOT_SERVICE_EXPOSED=PASS")
          PY

      - name: Architecture deliverables gate
        run: |
          test -s architecture/HLD.md
          test -s architecture/LLD.md
          test -s security/OWASP-API-Security-Top10-2023.md
          test -s diagrams/uml/component.puml
          test -s diagrams/uml/sequence-payment-create.puml
          test -s diagrams/uml/deployment-openshift.puml
          test -s evidence/CLAIM-EVIDENCE-MATRIX.md
