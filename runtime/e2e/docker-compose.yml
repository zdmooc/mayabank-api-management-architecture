services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command:
      - start-dev
      - --health-enabled=true
      - --metrics-enabled=true
      - --http-management-port=9000
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: e2e-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
      - "9000:9000"

  payment-api:
    build:
      context: ./payment-api
    environment:
      OIDC_EXPECTED_ISSUER: http://localhost:8080/realms/mayabank
      OIDC_JWKS_URL: http://keycloak:8080/realms/mayabank/protocol/openid-connect/certs
      OIDC_AUDIENCE: payment-api
    depends_on:
      - keycloak

  kong:
    image: kong:3.9.3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./generated/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - payment-api
