name: mayabank-kind-e2e

on:
  pull_request:
    paths:
      - "runtime/kind/**"
      - "runtime/e2e/**"
      - "apis/openapi/**"
      - ".github/workflows/kind-e2e.yml"
  push:
    branches: [main]
    paths:
      - "runtime/kind/**"
      - "runtime/e2e/**"
      - ".github/workflows/kind-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: mayabank-api
          wait: 120s
      - name: Run full Kubernetes Kind E2E
        run: bash runtime/kind/run-kind.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n mayabank-api get pods,deploy,svc -o wide || true
          kubectl -n mayabank-api describe pods || true
          kubectl -n mayabank-api logs deployment/keycloak --tail=100 || true
          kubectl -n mayabank-api logs deployment/payment-api --tail=100 || true
          kubectl -n mayabank-api logs deployment/kong --tail=100 || true
