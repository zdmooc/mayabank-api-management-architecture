name: validate-contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Validate OpenAPI
        run: python scripts/validate_openapi.py apis/openapi/payment-api.yaml

      - name: Validate AsyncAPI
        run: python scripts/validate_asyncapi.py apis/asyncapi/payment-events.yaml

      - name: Secret hygiene
        run: python scripts/no_secrets_check.py

      - name: Shared-platform CRC profile gate
        shell: bash
        run: |
          set -euo pipefail
          bash -n runtime/shared-platform/scripts/*.sh
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = [
              Path("runtime/shared-platform/capability-consumption.yaml"),
              *sorted(Path("runtime/shared-platform/manifests").glob("*.yaml")),
          ]
          for path in paths:
              docs=list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              assert docs and all(doc is not None for doc in docs), path
              print("validated", path)
          PY
          test -s runtime/shared-platform/kong/kong.template.yml
          grep -q 'traces_endpoint: "__OTEL_TRACES_ENDPOINT__"' runtime/shared-platform/kong/kong.template.yml
          grep -q 'keycloak-service.keycloak-system.svc:8080' runtime/shared-platform/manifests/payment-api.yaml
          grep -q 'otel-collector.shared-observability.svc:4318' runtime/shared-platform/capability-consumption.yaml

      - name: Architecture deliverables gate
        run: |
          test -s architecture/HLD.md
          test -s architecture/LLD.md
          test -s security/OWASP-API-Security-Top10-2023.md
          test -s diagrams/uml/component.puml
          test -s diagrams/uml/sequence-payment-create.puml
          test -s diagrams/uml/deployment-openshift.puml
          test -s evidence/CLAIM-EVIDENCE-MATRIX.md
