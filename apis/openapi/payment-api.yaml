openapi: 3.2.0
info:
  title: MayaBank Payment API
  version: 1.1.0
  description: |
    Contract-first sample for the MayaBank API Management architecture.

    Security model:
    - the gateway authenticates the token (signature, expiry) and identifies the
      client application;
    - the Payment API validates issuer, audience and scope, and enforces
      object-level authorization: a payment is only visible to the client
      application that created it (other clients receive 404);
    - `Idempotency-Key` is scoped per client application and bound to the
      request payload.
  contact:
    name: MayaBank API Management lab
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.sandbox.mayabank.example
    description: Reference sandbox (illustrative)
  - url: http://localhost:8000
    description: Local Kong gateway (runtime/e2e)
tags:
  - name: payments
    description: Payment initiation and status
paths:
  /payments:
    post:
      operationId: createPayment
      summary: Create a payment
      description: >-
        Creates a payment for the calling client application. Replaying the same
        `Idempotency-Key` with the same payload returns the original payment with
        `Idempotency-Replayed: true`; replaying it with a different payload
        returns 422.
      tags: [payments]
      security:
        - oauth2:
            - payments.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment created, or original payment replayed
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Get a payment
      description: >-
        Returns a payment created by the calling client application. A payment
        owned by another client is reported as 404, so that its existence is not
        disclosed.
      tags: [payments]
      security:
        - oauth2:
            - payments.read
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Payment
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >-
        Authorization Code + PKCE for user-facing channels; Client Credentials
        for machine-to-machine partners (the flow exercised by runtime/e2e).
      flows:
        authorizationCode:
          authorizationUrl: https://id.mayabank.example/authorize
          tokenUrl: https://id.mayabank.example/token
          scopes:
            payments.read: Read payments
            payments.write: Create payments
        clientCredentials:
          tokenUrl: https://id.mayabank.example/token
          scopes:
            payments.read: Read payments
            payments.write: Create payments
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Client-generated key, unique per client application and payment intent.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CorrelationId:
      in: header
      name: X-Correlation-ID
      required: false
      description: Correlation identifier; generated by the gateway when absent.
      schema:
        type: string
  headers:
    IdempotencyReplayed:
      description: '`true` when the response replays a previous request with the same key.'
      schema:
        type: string
        enum: ['true', 'false']
    CorrelationId:
      description: Correlation identifier echoed by the gateway.
      schema:
        type: string
  schemas:
    PaymentRequest:
      type: object
      additionalProperties: false
      required: [debtorAccountId, creditorIban, amount]
      properties:
        debtorAccountId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        creditorIban:
          type: string
          description: Uppercase IBAN; the API validates supported country-specific length and MOD97 checksum.
          pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$'
        amount:
          $ref: '#/components/schemas/Money'
    Payment:
      type: object
      additionalProperties: false
      required: [paymentId, status, amount]
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [RECEIVED, ACCEPTED, REJECTED, SETTLED]
        amount:
          $ref: '#/components/schemas/Money'
    Money:
      type: object
      additionalProperties: false
      required: [value, currency]
      properties:
        value:
          type: string
          description: Strictly positive decimal amount not exceeding 1,000,000,000 units (422 outside this range).
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
        currency:
          type: string
          enum: [EUR, USD, GBP, CHF, CAD, JPY]
    Problem:
      type: object
      additionalProperties: false
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        correlationId: { type: string }
        detail: { type: string }
  responses:
    Problem:
      description: Problem response (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
